name: APK bouwen

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ondertekensleutel klaarzetten
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Bouwen
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Hernoemen
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/release/app-release.apk "SprinterOBD-${{ github.run_number }}.apk"

      - name: Publiceren als release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sprinter OBD build ${{ github.run_number }}
          body: "Automatisch gebouwd uit ${{ github.sha }}. Download de .apk hieronder op je telefoon en installeer."
          files: SprinterOBD-${{ github.run_number }}.apk
          make_latest: true
